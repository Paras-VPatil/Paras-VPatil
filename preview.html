<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paras Patil GitHub Profile Preview</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #d0d7de;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.08), transparent 22%),
        radial-gradient(circle at top right, rgba(15, 23, 42, 0.06), transparent 20%),
        var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px 18px 40px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section {
      padding: 20px 22px;
      border-top: 1px solid #edf2f7;
    }
    .section:first-child { border-top: 0; }
    .center { text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }
    .avatar {
      width: 170px;
      height: 170px;
      display: block;
      border-radius: 50%;
      border: 4px solid #60a5fa;
      object-fit: cover;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.16);
      margin: 0 auto;
    }
    .stats {
      width: 100%;
      max-width: 470px;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
    }
    .typed {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 999px;
      background: #0f172a;
      color: #cbd5e1;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.16);
      max-width: 100%;
    }
    .typed strong { color: #7dd3fc; }
    .snake-note {
      border: 1px dashed #93c5fd;
      background: linear-gradient(180deg, #eff6ff, #ffffff);
      border-radius: 16px;
      padding: 18px;
      color: #1d4ed8;
      font-weight: 600;
      margin-top: 8px;
    }
    .icons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .badge-row img,
    .icons img {
      display: block;
      max-width: 100%;
    }
    h2, h3 {
      margin: 0 0 12px;
      font-size: 18px;
      color: var(--text);
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .avatar { width: 150px; height: 150px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="section center">
        <img
          alt="Animated header"
          src="https://capsule-render.vercel.app/api?type=wave&color=0:020617,100:0f172a&height=220&section=header&text=Paras%20Patil&fontSize=42&fontColor=E2E8F0&fontAlignY=34&desc=AI%20%26%20Data%20Science%20Enthusiast%20%7C%20IT%20Student&descSize=18&descAlignY=54&animation=fadeIn"
          style="max-width:100%; height:auto;"
        />
      </div>

      <div class="section center">
        <img
          alt="Typing about me animation"
          src="https://readme-typing-svg.demolab.com?font=Fira+Code&weight=600&size=18&pause=1200&color=58A6FF&center=true&vCenter=true&width=760&lines=const+aboutMe+%3D+%7B;name:+%22Paras+Patil%22,;role:+%22AI+%26+Data+Science+Enthusiast%22,;stack:+%5B%22Python%22,+%22JavaScript%22,+%22React%22,+%22PyTorch%22%5D,;currentFocus:+%22Animated+GitHub+profile+README%22,;%7D"
          style="max-width:100%; height:auto;"
        />
      </div>

      <div class="section">
        <div class="grid">
          <img class="avatar" src="./assets/avatar.gif" alt="Animated avatar of Paras Patil" />
          <img class="stats" src="https://github-readme-stats.vercel.app/api?username=paras-patil16&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&theme=tokyonight&hide_border=true" alt="GitHub stats card for Paras Patil" />
        </div>
      </div>

      <div class="section center">
        <h2>Contribution Snake</h2>
        <div class="snake-note">The live snake SVG will show here after the GitHub Action runs and publishes to the <code>output</code> branch.</div>
      </div>

      <div class="section center">
        <h2>Tech Stack</h2>
        <div class="icons">
          <img alt="Technology icons" src="https://skillicons.dev/icons?i=python,javascript,typescript,react,nodejs,tailwind,html,css,git,github,linux,pytorch,tensorflow,vscode" />
        </div>
      </div>

      <div class="section center">
        <div class="badge-row">
          <a href="https://github.com/paras-patil16"><img alt="GitHub badge" src="https://img.shields.io/badge/GitHub-paras--patil16-0f172a?style=flat-square&logo=github&logoColor=white" /></a>
          <img alt="Profile views badge" src="https://komarev.com/ghpvc/?username=paras-patil16&label=profile%20views&color=0f172a&style=flat-square" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
