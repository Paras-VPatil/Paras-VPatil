<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Paras Patil profile header</title>
  <desc id="desc">A dark code-themed banner with a blinking cursor and subtle glow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="65%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#bg)" />
  <rect width="1200" height="240" rx="24" fill="url(#grid)" />
  <rect x="0" y="0" width="1200" height="240" rx="24" fill="url(#glow)" />
  <rect x="18" y="18" width="1164" height="204" rx="20" fill="none" stroke="#1f2937" stroke-width="1.5" />

  <g transform="translate(42 36)">
    <circle cx="0" cy="0" r="6" fill="#ef4444" />
    <circle cx="18" cy="0" r="6" fill="#f59e0b" />
    <circle cx="36" cy="0" r="6" fill="#22c55e" />
  </g>

  <rect x="36" y="54" width="1128" height="1" fill="url(#accent)" />
  <text x="50" y="112" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700">
    const aboutMe = {
  </text>
  <text x="50" y="152" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    name: "Paras Patil",
  </text>
  <text x="50" y="186" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    role: "AI &amp; Data Science Enthusiast",
  </text>
  <text x="50" y="220" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    stack: ["Python", "JavaScript", "React", "PyTorch"]
    <tspan dx="8" fill="#38bdf8">|</tspan>
  </text>

  <text x="847" y="101" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" opacity="0.9">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="1.2s" repeatCount="indefinite" />
    /profile/README.md
  </text>
  <text x="847" y="132" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    building a readable, animated GitHub profile
  </text>
  <text x="847" y="160" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    ascii portrait + stats + streak + snake + language card
  </text>
  <rect x="1068" y="94" width="4" height="74" rx="2" fill="#38bdf8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite" />
  </rect>
</svg>
